# 모든 프로필이 공유하는 설정입니다.
# 값은 ${ENV:default} 형태로 받고, 프로필 파일(application-local.yml, application-prod.yml)은 차이만 덮어씁니다.
# 기본값이 없는 접속 정보(SPRING_DATASOURCE_URL/USERNAME/PASSWORD, SPRING_KAFKA_BOOTSTRAP_SERVERS,
# THESEUS_CORE_BASE_URL)는 환경변수 relaxed binding으로 주입합니다.
spring:
  application:
    name: theseus-api-server
  profiles:
    # SPRING_PROFILES_ACTIVE가 없을 때만 local을 씁니다. 배포 환경은 prod를 명시합니다.
    default: local
  threads:
    virtual:
      # 채팅 스트림 프록시와 SSE가 Core 응답을 블로킹으로 기다리므로 플랫폼 스레드 풀 고갈을 막습니다.
      enabled: true
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT_MILLIS:1800000}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    # 스트리밍 응답 동안 DB 커넥션을 붙잡지 않도록 OSIV를 끕니다. 응답 DTO는 서비스 트랜잭션 안에서 완성합니다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 소유하고 Hibernate는 엔티티와 일치하는지만 검증합니다.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전 ddl-auto로 만들어진 기존 DB는 V1을 적용된 것으로 기록(baseline)하고 이후 버전만 실행합니다.
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:theseus-api-tool-generation}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # 컨테이너 HEALTHCHECK와 compose depends_on 용도로 health만 노출합니다.
        include: health
  endpoint:
    health:
      show-details: never

theseus:
  kafka:
    # API와 Core가 같은 환경변수 이름(KAFKA_TOPIC_*)으로 토픽을 공유합니다.
    topics:
      tool-plan-request: ${KAFKA_TOPIC_TOOL_PLAN_REQUEST:theseus.tool-plan.request}
      tool-plan-event: ${KAFKA_TOPIC_TOOL_PLAN_EVENT:theseus.tool-plan.event}
      tool-build-request: ${KAFKA_TOPIC_TOOL_BUILD_REQUEST:theseus.tool-build.request}
      tool-build-event: ${KAFKA_TOPIC_TOOL_BUILD_EVENT:theseus.tool-build.event}
  cors:
    # 쉼표로 구분한 origin 목록입니다. 비워 두면 CORS를 끄고 same-origin(nginx 프록시) 요청만 받습니다.
    allowed-origins: ${ALLOWED_ORIGINS:}
  tool-generation:
    state-ttl-minutes: ${THESEUS_TOOL_GENERATION_STATE_TTL_MINUTES:30}
    sse-timeout-millis: ${THESEUS_TOOL_GENERATION_SSE_TIMEOUT_MILLIS:1800000}
    run-timeout-minutes: ${THESEUS_TOOL_PLAN_RUN_TIMEOUT_MINUTES:30}
    requested-run-timeout-minutes: ${THESEUS_TOOL_PLAN_REQUESTED_RUN_TIMEOUT_MINUTES:180}
    run-timeout-check-delay-millis: ${THESEUS_TOOL_PLAN_RUN_TIMEOUT_CHECK_DELAY_MILLIS:60000}
    run-timeout-scheduler-enabled: ${THESEUS_TOOL_PLAN_RUN_TIMEOUT_SCHEDULER_ENABLED:true}
    run-timeout-batch-size: ${THESEUS_TOOL_PLAN_RUN_TIMEOUT_BATCH_SIZE:20}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

jwt:
  # 필수값입니다. HMAC-SHA 서명용이라 32바이트 이상이어야 합니다.
  secret: ${JWT_SECRET}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:1209600000}
  refresh-token-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refresh_token}
  refresh-token-cookie-path: ${JWT_REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
  refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
  refresh-token-cookie-same-site: ${JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

internal:
  # Core <-> API 내부 호출에 쓰는 공유 키입니다. 비어 있으면 /api/internal/** 요청은 모두 401입니다.
  api-key: ${INTERNAL_API_KEY:}
