# 로컬 개발(IDE 실행 또는 local compose) 전용 덮어쓰기입니다. 공통값은 application.yaml에 있습니다.
spring:
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:../../infra/docker/local/.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/theseus}
    username: ${SPRING_DATASOURCE_USERNAME:theseus}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      port: ${SPRING_DATA_REDIS_PORT:16379}
  jpa:
    hibernate:
      # 로컬은 엔티티 변경을 바로 반영하도록 update를 유지합니다. 새 DB는 Flyway V1이 먼저 스키마를 만듭니다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

theseus:
  core:
    base-url: ${THESEUS_CORE_BASE_URL:http://localhost:8086}
  cors:
    # 로컬 Vite 개발 서버에서 API를 직접 호출할 수 있도록 기본 origin을 둡니다.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
