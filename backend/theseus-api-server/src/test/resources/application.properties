# 테스트 전용 설정입니다. local 프로필(.env.local import, localhost 기본값)을 타지 않도록 test 프로필을 씁니다.
# DB와 Redis 접속 정보는 IntegrationTestSupport의 Testcontainers(@ServiceConnection)가 주입합니다.
spring.profiles.active=test
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=127.0.0.1:9
theseus.core.base-url=http://127.0.0.1:9
theseus.tool-generation.run-timeout-scheduler-enabled=false
jwt.secret=test-only-jwt-secret-0123456789abcdef-0123
internal.api-key=test-internal-api-key
