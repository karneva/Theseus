# 의존성·베이스 이미지·Actions 버전 갱신 PR을 매주 받습니다.
# minor/patch 갱신은 생태계별로 한 PR에 묶어 리뷰 부담을 줄이고, major 갱신은 개별 PR로 받습니다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend/theseus-api-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Spring Boot 4는 별도 마이그레이션(Kafka 자동 설정 패키지 이동, Jackson 3, 테스트 패키지 변경)이 필요하고,
    # springdoc 3.x는 Boot 4 전용입니다. 마이그레이션할 때 이 규칙을 지웁니다.
    ignore:
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend/theseus-core-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7은 typescript-eslint가 아직 지원하지 않습니다(peer typescript <6.1). 지원되면 지웁니다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node는 런타임 Node 버전(.nvmrc, CI)과 같은 메이저로 맞춰 수동으로 올립니다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # gradle/actions v6부터 캐시가 독점 구성 요소이고 Gradle 이용약관 동의가 필요합니다. 약관을 받아들이기로 하면 지웁니다.
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend/theseus-api-server
      - /backend/theseus-core-server
      - /frontend
      - /infra/docker/selfhost/nginx
    schedule:
      interval: weekly
    ignore:
      # Core Python 버전은 CI(setup-python)·Dockerfile.sandbox와 함께 수동으로 올립니다.
      # 3.15는 onnxruntime cp315 휠이 아직 없어 이미지 빌드가 실패합니다.
      - dependency-name: "python"
        versions: [">=3.12"]
    commit-message:
      prefix: build
      include: scope
