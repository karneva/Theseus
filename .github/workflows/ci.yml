# PR과 기본 브랜치 push마다 서비스별 테스트·빌드, compose 문법, 비밀 유출 여부를 검사합니다.
# 이 워크플로는 검증만 하고 이미지 푸시나 배포는 하지 않습니다.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소해 러너 시간을 아낍니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Gradle test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/theseus-api-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # gradlew는 저장소에 실행 비트(100755)로 등록되어 있어 chmod 없이 실행합니다.
      # Testcontainers는 ubuntu 러너의 Docker를 그대로 사용합니다.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: backend/theseus-api-server/build/reports/tests/
          if-no-files-found: ignore

  core:
    name: Core (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/theseus-core-server
    # ENV는 지정하지 않아 Core의 비운영 기본값으로 import·테스트합니다(prod 필수 비밀 값 검사를 피함).
    # tests/는 DB(Postgres)·Kafka·Docker 없이 돌도록 되어 있고, app lifespan(init_db, consumer 기동)은 실행하지 않습니다.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/theseus-core-server/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers가 끌어오는 torch는 기본이 CUDA 빌드(수 GB)라 CPU 빌드를 먼저 설치합니다.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # 테스트 전용 의존성은 pytest 하나뿐입니다(설정은 pytest.ini: testpaths=tests, pythonpath=.).
          pip install pytest

      # 앱 모듈 그래프가 깨지지 않았는지(누락된 import, 순환 import) 기동 없이 확인합니다.
      - name: Import smoke test
        run: python -c "import src.main"

      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # test 스크립트(vitest)가 watch 모드로 멈추지 않도록 --run으로 한 번만 실행합니다.
      - run: npm test -- --run
      - run: npm run build

  infra:
    name: Infra (compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # .env.example의 빈 값은 dummy 값으로 채워 변수 치환과 필수(:?) 변수 검사를 통과시킨 뒤 compose 문법만 검증합니다.
      # 단, 비워 두면 기본 호스트 경로를 쓰는 bind 경로 변수(REMOTE_WORKSPACE_KEYS_DIR)는 그대로 둡니다.
      # 'ci-dummy'처럼 '/'가 없는 값은 compose가 named volume 이름으로 해석해 검증이 실패하기 때문입니다.
      # selfhost compose는 env_file을 쓰지 않으므로 --env-file로만 넘깁니다(서버에서는 /opt/theseus/theseus.env).
      - name: Validate self-hosting compose
        run: |
          env_file="$RUNNER_TEMP/selfhost.ci.env"
          sed -E '/^REMOTE_WORKSPACE_KEYS_DIR=/!s/^([A-Za-z_][A-Za-z0-9_]*)=[[:space:]]*$/\1=ci-dummy/' \
            infra/docker/selfhost/.env.example > "$env_file"
          docker compose --env-file "$env_file" -f infra/docker/selfhost/docker-compose.yml config --quiet

      # local compose 3개는 env_file: .env.local을 읽고 서로의 서비스에 의존하므로 템플릿을 복사해 함께 검증합니다.
      # .env.local은 .gitignore 대상이며 러너 작업 공간에만 생깁니다.
      - name: Validate local compose
        working-directory: infra/docker/local
        run: |
          sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)=[[:space:]]*$/\1=ci-dummy/' .env.local.example > .env.local
          docker compose -f docker-compose.infra.yml -f docker-compose.api.yml -f docker-compose.core.yml config --quiet

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # PR·push 범위의 커밋 이력을 스캔하므로 전체 이력이 필요합니다.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR 코멘트 작성에는 쓰기 권한이 필요하므로 끄고, 결과는 job 실패와 로그로만 알립니다.
          GITLEAKS_ENABLE_COMMENTS: "false"
