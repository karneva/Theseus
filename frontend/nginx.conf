server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 리소스 압축. gzip_types에 text/event-stream을 넣지 않아 SSE 응답은 압축하지 않는다
    # (압축 버퍼링 때문에 스트림 이벤트가 늦게 도착하는 것을 막기 위함). 이 서버는 정적 파일만 서빙하고
    # /api 프록시는 앞단 리버스 프록시가 담당한다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Vite가 내용 해시를 붙여 내보내는 빌드 산출물. 파일명이 바뀌어야만 내용이 바뀌므로 1년 immutable 캐시.
    # ^~ 로 지정해 아래 확장자 정규식 location보다 우선하게 한다.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/에서 그대로 복사되는 해시 없는 파일(favicon 등)은 교체가 반영되도록 짧게 캐시한다.
    location ~* \.(?:ico|png|svg|webp|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA 라우팅. 없는 경로는 index.html로 보내고, index.html은 새 배포의 해시 파일명을
    # 바로 가리키도록 매번 재검증한다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
