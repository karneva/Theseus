# 서버 core가 reverse tunnel로 호출하는 경로만 Ollama로 넘기고 나머지는 거부한다.
# core 사용 경로: GET /v1/models(모델 확인), POST /v1/chat/completions(채팅·도구 호출·structured output).
server {
    listen 8080;
    server_tokens off;

    # 도구 스키마와 ToolPlan 프롬프트가 커서 요청 본문 상한을 넉넉히 둔다.
    client_max_body_size 8m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /v1/models {
        limit_except GET { deny all; }
        proxy_pass http://ollama:11434;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass http://ollama:11434;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 스트리밍 응답(SSE)을 그대로 흘려보낸다.
        proxy_buffering off;
        proxy_cache off;
        # PLAN 구조화 생성이 2분 가까이 걸리므로 core의 LLM 타임아웃(300초)보다 길게 둔다.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 그 외 모든 경로(/api/pull, /api/delete, /api/create, /api/generate 등)는 거부.
    location / {
        return 403;
    }
}
