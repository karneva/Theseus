# 로컬 개발용 인프라(MySQL, PostgreSQL+pgvector, Redis, Kafka, Kafka UI)입니다.
# 컨테이너 env는 .env.local(템플릿: .env.local.example)에서 읽습니다.
#   cp infra/docker/local/.env.local.example infra/docker/local/.env.local
#   docker compose -f infra/docker/local/docker-compose.infra.yml up -d
# 호스트 포트는 모두 127.0.0.1에만 바인딩합니다. Docker publish는 OS 방화벽을 우회하므로
# 0.0.0.0으로 열면 같은 네트워크의 다른 기기에서 DB와 Kafka에 바로 접근할 수 있습니다.

services:
  theseus-local-mysql:
    image: mysql:8.4.6
    container_name: theseus-local-mysql
    # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - theseus-local-mysql-data:/var/lib/mysql
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  theseus-local-postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: theseus-local-postgres
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - theseus-local-postgres-data:/var/lib/postgresql/data
      - ./initdb/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  theseus-local-redis:
    image: redis:7.4.5-alpine
    container_name: theseus-local-redis
    restart: unless-stopped
    # API가 쓰는 SPRING_DATA_REDIS_PASSWORD를 그대로 requirepass로 씁니다(값을 한 곳에서만 관리).
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:16379:6379"
    command:
      - /bin/sh
      - -c
      - ': "$${SPRING_DATA_REDIS_PASSWORD:?set SPRING_DATA_REDIS_PASSWORD in .env.local}"; exec docker-entrypoint.sh redis-server --requirepass "$$SPRING_DATA_REDIS_PASSWORD" --appendonly yes'
    volumes:
      - theseus-local-redis-data:/data
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$SPRING_DATA_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # KRaft 단일 노드. 컨테이너용 INTERNAL(29092)과 IDE에서 띄운 API/Core용 EXTERNAL(127.0.0.1:19092)을 둡니다.
  theseus-local-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: theseus-local-kafka
    # .env.local은 넘기지 않습니다. cp-kafka는 KAFKA_*로 시작하는 env를 모두 브로커 설정으로 바꾸기 때문입니다.
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - theseus-local-kafka-data:/var/lib/kafka/data
    environment:
      # 로컬 전용 고정값입니다. 비밀값이 아니며, 바꾸려면 kafka-data 볼륨을 지운 뒤 KAFKA_CLUSTER_ID를 셸이나 --env-file로 줍니다.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5f55wRIfQ0KiuThOsp0iug}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@theseus-local-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://theseus-local-kafka:29092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server theseus-local-kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 업무 토픽 4개와 API 결과 이벤트 consumer의 DLT 토픽 2개를 만듭니다. --if-not-exists라 여러 번 돌아도 안전합니다.
  theseus-local-kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: theseus-local-kafka-init
    env_file:
      - .env.local
    depends_on:
      theseus-local-kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        PLAN_REQUEST="$${KAFKA_TOPIC_TOOL_PLAN_REQUEST:-theseus.tool-plan.request}"
        PLAN_EVENT="$${KAFKA_TOPIC_TOOL_PLAN_EVENT:-theseus.tool-plan.event}"
        BUILD_REQUEST="$${KAFKA_TOPIC_TOOL_BUILD_REQUEST:-theseus.tool-build.request}"
        BUILD_EVENT="$${KAFKA_TOPIC_TOOL_BUILD_EVENT:-theseus.tool-build.event}"
        create_topic() {
          kafka-topics --bootstrap-server theseus-local-kafka:29092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        create_topic "$$PLAN_REQUEST" 3
        create_topic "$$PLAN_EVENT" 3
        create_topic "$$BUILD_REQUEST" 3
        create_topic "$$BUILD_EVENT" 3
        create_topic "$${PLAN_EVENT}.DLT" 1
        create_topic "$${BUILD_EVENT}.DLT" 1
    networks:
      - theseus-local-network

  theseus-local-kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: theseus-local-kafka-ui
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: theseus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: theseus-local-kafka:29092
    depends_on:
      theseus-local-kafka:
        condition: service_healthy
    networks:
      - theseus-local-network

networks:
  theseus-local-network:
    name: theseus-local-network

volumes:
  theseus-local-mysql-data:
    name: theseus-local-mysql-data
  theseus-local-postgres-data:
    name: theseus-local-postgres-data
  theseus-local-redis-data:
    name: theseus-local-redis-data
  theseus-local-kafka-data:
    name: theseus-local-kafka-data
