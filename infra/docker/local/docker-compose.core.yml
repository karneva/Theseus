# 로컬 Docker 통합 확인용 Core Server와 sandbox 구성입니다. infra/api compose와 함께 씁니다.
#   docker compose -f docker-compose.infra.yml -f docker-compose.api.yml -f docker-compose.core.yml up -d
# Core는 docker.sock을 직접 마운트하지 않고 docker-socket-proxy를 거쳐 sandbox 컨테이너를 만듭니다
# (셀프호스팅 구성과 같은 방식이라 DOCKER_GID 맞추기가 필요 없습니다).

services:
  # sandbox 이미지를 로컬 Docker에 빌드합니다. Core가 이 태그로 sandbox 컨테이너를 띄웁니다.
  theseus-sandbox-image:
    build:
      context: ../../../backend/theseus-core-server
      dockerfile: Dockerfile.sandbox
    image: ${SANDBOX_IMAGE:-theseus-sandbox:py311-tools}
    container_name: theseus-local-sandbox-image
    command:
      - python
      - -c
      - import pydantic, psutil, markdownify, bs4, yaml, requests, httpx, numpy, packaging, dotenv
    restart: "no"
    network_mode: "none"

  # Core 사용자(uid/gid 999)가 sandbox 공유 디렉터리와 custom-tools 볼륨에 쓸 수 있게 소유권을 맞춥니다.
  theseus-core-permissions:
    image: alpine:3.20.6
    container_name: theseus-local-core-permissions
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /sandbox-temp /custom-tools
        chown -R 999:999 /sandbox-temp /custom-tools
        chmod 770 /sandbox-temp
        chmod 750 /custom-tools
    restart: "no"
    network_mode: "none"
    volumes:
      - ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}:/sandbox-temp
      - theseus-local-custom-tools:/custom-tools

  # Docker API 중 containers/images와 쓰기 메서드만 Core에 열어 줍니다.
  theseus-local-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: theseus-local-docker-proxy
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      EVENTS: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  theseus-core-server:
    build:
      context: ../../../backend/theseus-core-server
      dockerfile: Dockerfile
    image: theseus-core-server:local
    container_name: theseus-local-core-server
    # INTERNAL_API_KEY, POSTGRES_USER/PASSWORD/DB(Core가 CORE_POSTGRES_* 별칭으로 읽음), THESEUS_MODEL, LLM 키
    env_file:
      - .env.local
    # Linux Docker에서도 host.docker.internal로 호스트의 Ollama에 닿게 합니다(Docker Desktop은 기본 제공).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENV: local
      AUTH_MODE: spring
      SANDBOX_STARTUP_CHECK: "false"
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-theseus-sandbox:py311-tools}
      DOCKER_HOST: tcp://theseus-local-docker-proxy:2375
      THESEUS_DATA_DIR: /home/appuser/.theseus/data
      # sandbox 컨테이너는 호스트 Docker가 띄우므로 호스트 경로와 Core 안 경로를 한 쌍으로 맞춥니다.
      SANDBOX_HOST_TEMP_ROOT: ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      SANDBOX_CONTAINER_TEMP_ROOT: /tmp/theseus-sandbox-shared
      # 생성 Tool을 이미지 안 패키지 경로가 아닌 볼륨에 저장해 컨테이너를 다시 만들어도 남게 합니다.
      THESEUS_CUSTOM_TOOLS_DIR: /custom-tools
      THESEUS_PROJECT_CUSTOM_TOOLS_DIR: /custom-tools
      CORE_POSTGRES_HOST: theseus-local-postgres
      CORE_POSTGRES_PORT: "5432"
      CORE_KAFKA_BOOTSTRAP_SERVERS: theseus-local-kafka:29092
      SPRING_BOOT_INTERNAL_URL: http://theseus-api-server:8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}:/tmp/theseus-sandbox-shared
      - theseus-local-custom-tools:/custom-tools
      - theseus-local-core-data:/home/appuser/.theseus/data
      - theseus-local-hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      theseus-local-postgres:
        condition: service_healthy
      theseus-local-kafka:
        condition: service_healthy
      theseus-local-kafka-init:
        condition: service_completed_successfully
      theseus-local-docker-proxy:
        condition: service_healthy
      theseus-sandbox-image:
        condition: service_completed_successfully
      theseus-core-permissions:
        condition: service_completed_successfully
    networks:
      - theseus-local-network

networks:
  theseus-local-network:
    name: theseus-local-network

volumes:
  theseus-local-custom-tools:
    name: theseus-local-custom-tools
  theseus-local-core-data:
    name: theseus-local-core-data
  theseus-local-hf-cache:
    name: theseus-local-hf-cache
