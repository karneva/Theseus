# Theseus 엣지 리버스 프록시 공통 설정입니다.
# 서버 블록은 컨테이너 기동 시 templates/{http,https}/ 중 하나를 envsubst로 렌더링해 conf.d에 만듭니다
# (docker-entrypoint.d/18-theseus-tls-mode.envsh 참고).
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # 버전 노출을 막습니다.
    server_tokens off;

    # 채팅 메시지와 Tool 요청 본문 상한입니다. 기본값 1m은 긴 프롬프트에 부족할 수 있습니다.
    client_max_body_size 10m;

    # text/event-stream은 목록에 넣지 않습니다. SSE를 압축하면 버퍼링 때문에 이벤트가 늦게 도착합니다.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript image/svg+xml;

    # proxy_pass에 변수를 쓰므로 Docker 내장 DNS로 서비스 이름을 요청 시점에 해석합니다.
    # 덕분에 api/frontend 컨테이너가 재생성되어 IP가 바뀌어도 nginx reload 없이 따라갑니다.
    resolver          127.0.0.11 valid=10s ipv6=off;
    resolver_timeout  5s;

    # 로그인(/api/v1/auth/) 무차별 대입 방어용 IP별 요청 제한입니다.
    limit_req_zone      $binary_remote_addr zone=theseus_auth:10m rate=10r/m;
    # 토큰 재발급(/api/v1/auth/refresh)은 페이지를 열 때마다 호출되므로 따로 넉넉하게 둡니다.
    # 같은 사무실 NAT IP를 쓰는 여러 사용자의 새로고침이 로그인 예산을 소진하지 않게 합니다.
    limit_req_zone      $binary_remote_addr zone=theseus_auth_refresh:10m rate=60r/m;
    limit_req_status    429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
