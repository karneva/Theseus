# 앱 라우팅입니다. HTTP 템플릿과 HTTPS 템플릿의 앱 server 블록이 같은 내용을 include합니다.
# 사용 전에 server 블록에서 $theseus_api, $theseus_frontend 변수를 set해야 합니다.
#
# 외부 노출 정책
# - /api/v1/**만 API로 보냅니다. Core(8086)는 외부에 노출하지 않습니다(예전 /core/ 프록시 삭제).
# - /api/internal/**은 Core <-> API 서버 간 호출 전용이라 엣지에서 404로 막습니다.
# - Swagger, OpenAPI 문서, actuator는 외부에 내보내지 않습니다.
# nginx는 location을 고르기 전에 URI를 정규화(%XX 디코딩, //, /./, /../ 처리)하므로
# 인코딩이나 경로 조작으로 아래 차단 규칙을 우회할 수 없습니다.

location ^~ /api/internal {
    return 404;
}

location ^~ /swagger-ui {
    return 404;
}

location ^~ /v3/api-docs {
    return 404;
}

location ^~ /actuator {
    return 404;
}

# refresh 토큰 재발급입니다. 새로고침·새 탭마다 호출되므로 로그인과 다른 zone(IP당 분당 60회, 순간 60회)을 씁니다.
location = /api/v1/auth/refresh {
    limit_req zone=theseus_auth_refresh burst=60 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 60s;
    proxy_pass $theseus_api;
}

# 로그인과 로그아웃입니다. IP당 분당 10회, 순간 20회까지 허용합니다.
location ^~ /api/v1/auth/ {
    limit_req zone=theseus_auth burst=20 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 60s;
    proxy_pass $theseus_api;
}

# SSE 스트림입니다.
# - POST /api/v1/projects/{projectId}/sessions/{sessionId}/messages/stream  (채팅 스트림)
# - GET  /api/v1/projects/{projectId}/sessions/{sessionId}/tool-plan-runs/{runId}/events  (PLAN/BUILD 진행 이벤트)
# 버퍼링을 끄지 않으면 이벤트가 버퍼가 찰 때까지 묶여서 도착합니다.
# API의 SSE/async 타임아웃(기본 30분)보다 길게 읽기 타임아웃을 둡니다.
location ~ ^/api/v1/projects/[^/]+/sessions/[^/]+/(messages/stream|tool-plan-runs/[^/]+/events)$ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip off;
    proxy_pass $theseus_api;
}

location /api/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 300s;
    proxy_pass $theseus_api;
}

# 그 밖의 경로는 프론트엔드 정적 파일(SPA)입니다.
location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass $theseus_frontend;
}
